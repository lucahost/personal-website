name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: Skip npm cache
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_ENV: production

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: ${{ github.event.inputs.skip_cache == 'true' && '' || 'npm' }}

      # Fails when CV sources changed without re-rendering the derived
      # PDF/OG image (see "CV artifacts" in README.md). No deps needed.
      - name: CV artifact freshness
        run: npm run cv:check

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript type checking
        run: npx tsc --noEmit

      - name: ESLint code quality
        run: npm run lint

      - name: Build for production
        run: npm run build
        env:
          # Public URL of the telemetry proxy; empty ⇒ terminal telemetry disabled.
          VITE_TRACK_ENDPOINT: ${{ vars.TRACK_ENDPOINT }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: production-build-${{ github.sha }}
          path: dist/
          retention-days: 30
          compression-level: 9

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The VPS only accepts SSH over Tailscale (public :22 is closed at the
    # Hetzner firewall). Join the tailnet as an ephemeral tagged node and use
    # Tailscale SSH (authn/authz via the tailnet ACL); no SSH key secrets needed.
    env:
      TS_HOSTNAME: 100.102.93.2
      SSH_USERNAME: dp-ubuntu-16gb
      SSH_OPTS: -o StrictHostKeyChecking=no
    environment:
      name: production
      url: https://hostettler.io

    steps:
      # Checkout first (provides scripts/track-proxy/server.mjs for the proxy deploy).
      # Must run before download-artifact so its workspace clean doesn't wipe the artifact.
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: production-build-${{ github.sha }}
          path: website/dist/

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:prod-hetzner

      - name: Deploy to Server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # No --delete: matches the previous scp behaviour (add/overwrite only).
          rsync -az -e "ssh $SSH_OPTS" website/dist/ "${SSH_USERNAME}@${TS_HOSTNAME}:${DEPLOY_PATH}/"

      # --- Terminal telemetry proxy (opt-in via the DEPLOY_TRACK_PROXY repo variable) ---
      # One-time VPS setup required first: run scripts/track-proxy/setup-vps.sh on the server.
      - name: Deploy track-proxy
        if: ${{ vars.DEPLOY_TRACK_PROXY == 'true' }}
        run: |
          ssh $SSH_OPTS "${SSH_USERNAME}@${TS_HOSTNAME}" "mkdir -p ~/track-proxy"
          scp $SSH_OPTS scripts/track-proxy/server.mjs "${SSH_USERNAME}@${TS_HOSTNAME}:track-proxy/"

      - name: Restart track-proxy
        if: ${{ vars.DEPLOY_TRACK_PROXY == 'true' }}
        run: |
          # User-level service (no root): linger keeps /run/user/<uid> alive between deploys.
          # A non-interactive SSH shell has no session bus, so point systemctl --user at it.
          ssh $SSH_OPTS "${SSH_USERNAME}@${TS_HOSTNAME}" bash -s <<'EOF'
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          systemctl --user restart track-proxy
          systemctl --user --no-pager --lines=0 status track-proxy
          EOF
