name: VPS cluster

# Onboarding v2 (lucahost/vps-gitops): builds vps.yaml's components (web, track), pushes them to the
# box's registry, publishes the rendered artifact personal-website/manifests:<sha>, moves the tag
# live to it, and waits until Flux has applied it and the pods are Ready. (While live is absent or
# parked, after a rollback, a run only publishes.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # vps-deploy.yml joins the tailnet with this run's OIDC token

jobs:
  deploy:
    uses: lucahost/deploy-actions/.github/workflows/vps-deploy.yml@750f1298bd56c21f8e62dd1d95991e46a12b0caf # vps-deploy, 2026-11-28 (ubuntu-26.04 runners, deploy-actions#21)
    with:
      file: vps.yaml
    # The Environment vps's two secrets reach the called job only this way.
    secrets: inherit
