name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [dev, feature/*]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: Skip npm cache
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: ${{ github.event.inputs.skip_cache == 'true' && '' || 'npm' }}

      # Fails when CV sources changed without re-rendering the derived
      # PDF/OG image (see "CV artifacts" in README.md). No deps needed.
      - name: CV artifact freshness
        run: npm run cv:check

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npx tsc --noEmit

      - name: ESLint code quality
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Bundle size analysis
        run: |
          echo "📦 Bundle Analysis:"
          du -sh dist/
          echo "\n🗂️ Asset Breakdown:"
          find dist/assets -name '*.js' -o -name '*.css' | head -10 | xargs ls -lah

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: ${{ github.event.inputs.skip_cache == 'true' && '' || 'npm' }}

      - name: Install dependencies
        run: npm ci

      - name: Security vulnerability scan
        run: node scripts/check-audit.mjs

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
