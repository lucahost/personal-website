# nginx route for the terminal telemetry proxy.
#
# IMPORTANT: include this in the HTTPS server block — the one with `listen 443 ssl`
# and `location /` — NOT the `listen 80` block that does `return 301 https://...`.
# If it lands in the redirect block, POSTs to /track get 301'd and the body is
# dropped (and a quick https:// curl can still look like it half-works).
#
#   sudo cp nginx-track.conf /etc/nginx/snippets/track.conf
#   # then, inside the `server { listen 443 ssl; ... }` block for hostettler.io:
#   #     include snippets/track.conf;
#   sudo nginx -t && sudo systemctl reload nginx

location = /track {
    # Only POST is meaningful; let the proxy reject the rest.
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Small body only; the easter egg sends a tiny JSON blob.
    client_max_body_size 4k;

    # Optional edge rate-limit (defence in depth). DISABLED by default: it requires
    # a matching zone in http{}, and `nginx -t` fails with "unknown limit_req zone"
    # if that's missing. The Node proxy already enforces per-IP limits on its own.
    # To enable, declare the zone once in http{} (e.g. /etc/nginx/nginx.conf):
    #     limit_req_zone $binary_remote_addr zone=track:1m rate=2r/s;
    # then uncomment:
    #     limit_req zone=track burst=5 nodelay;
}
