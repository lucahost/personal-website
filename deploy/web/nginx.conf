# nginx of the `web` component (vps.yaml): serves the Vite build exactly as host nginx served
# /var/www/hostettler.io before the VPS cluster. Host nginx keeps everything else of the site:
# TLS, the Cloudflare gate, the security headers, gzip, the logs and the /track route
# (lucahost/vps-gitops tenants/personal-website.yaml). So this adds no header, no caching and no
# compression of its own: responses pass through host nginx as its static files did.
#
# Read-only root: the pid and the temp paths are in /tmp (an emptyDir), as in the base image.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;         # the host's copy (see the file)
    default_type application/octet-stream;
    types_hash_max_size 2048;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    access_log off;                        # host nginx logs every request (and ships it to SigNoz)

    # A directory without its trailing slash gets nginx's 301 as before, to the client's own
    # scheme and host: Location: https://hostettler.io/assets/, not this pod's http://…:8080.
    # Host nginx sends X-Forwarded-Proto ($scheme) and Host ($host) to this pod.
    map $http_x_forwarded_proto $client_scheme {
        default $scheme;
        https   https;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            if (-d $request_filename) {
                rewrite ^(.*[^/])$ $client_scheme://$host$1/ permanent;
            }
            # The SPA's routes: as the host's site had it.
            try_files $uri $uri/ /index.html;
        }
    }
}
